# Local development database. Port 5544 avoids clashing with a host PostgreSQL on 5432.
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
      POSTGRES_DB: scouttavling
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - dbdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scouttavling"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  dbdata:
