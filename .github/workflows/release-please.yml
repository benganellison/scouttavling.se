# Keeps a "chore(main): release x.y.z" PR up to date from Conventional Commits.
# Merging it creates the vX.Y.Z tag + GitHub Release and builds the container image.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Tags created with GITHUB_TOKEN don't trigger other workflows, so build here.
  container:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/container.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
