# Builds and publishes the container image for a release tag (vX.Y.Z) to GHCR,
# with build provenance. Triggered by pushed tags and called by release-please.
#
# ORIGIN is baked into the image: set the repository variable PUBLIC_ORIGIN
# (Settings → Variables → Actions), default https://scouttavling.se.
name: Container image

on:
  push:
    tags: ['v*.*.*']
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/scouttavling
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # vX.Y.Z → X.Y.Z, X.Y and an immutable sha tag. No "latest": deploys pin a version or digest.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=sha,format=long
          flavor: latest=false
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ORIGIN=${{ vars.PUBLIC_ORIGIN || 'https://scouttavling.se' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Image published"
            echo '```'
            echo "$TAGS"
            echo "digest: $DIGEST"
            echo '```'
            echo "Deploy: set APP_IMAGE=$IMAGE@$DIGEST in .env.prod"
          } >> "$GITHUB_STEP_SUMMARY"
