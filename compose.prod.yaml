# Production overlay: Traefik (HTTPS via Let's Encrypt) in front of the app,
# no published app/db ports, and periodic database dumps.
#
#   cp .env.example .env.prod && $EDITOR .env.prod      # DOMAIN, ACME_EMAIL, passwords, keys, APP_IMAGE
#   docker compose --env-file .env.prod -f compose.yaml -f compose.prod.yaml up -d
#
# Deploy a release by setting APP_IMAGE to the tagged image (ghcr.io/…:x.y.z or @sha256 digest).
# Keep a deploy freeze on competition weekends (docs/architecture/04 §8).

services:
  traefik:
    image: traefik:v3.7.15
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?Set ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  app:
    # Production runs the released image; never build on the server.
    image: ${APP_IMAGE:?Set APP_IMAGE to a released image, e.g. ghcr.io/benganellison/scouttavling:0.1.0}
    ports: !reset []
    environment:
      DEV_LOGIN: ""
    labels:
      - traefik.enable=true
      - traefik.http.routers.scouttavling.rule=Host(`${DOMAIN:?Set DOMAIN}`)
      - traefik.http.routers.scouttavling.entrypoints=websecure
      - traefik.http.routers.scouttavling.tls.certresolver=le
      - traefik.http.routers.scouttavling.middlewares=scouttavling-headers
      - traefik.http.services.scouttavling.loadbalancer.server.port=3000
      # www.<DOMAIN> → <DOMAIN> (permanent, path and query kept). Needs a DNS record for www too;
      # it gets its own certificate. Every other subdomain gets no answer from this stack.
      - traefik.http.routers.scouttavling-www.rule=Host(`www.${DOMAIN}`)
      - traefik.http.routers.scouttavling-www.entrypoints=websecure
      - traefik.http.routers.scouttavling-www.tls.certresolver=le
      - traefik.http.routers.scouttavling-www.middlewares=scouttavling-www-redirect
      - traefik.http.routers.scouttavling-www.service=scouttavling
      - traefik.http.middlewares.scouttavling-www-redirect.redirectregex.regex=^https?://www\.([^/]+)(.*)
      - traefik.http.middlewares.scouttavling-www-redirect.redirectregex.replacement=https://$${1}$${2}
      - traefik.http.middlewares.scouttavling-www-redirect.redirectregex.permanent=true
      - traefik.http.services.scouttavling.loadbalancer.healthcheck.path=/healthz
      - traefik.http.middlewares.scouttavling-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.scouttavling-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.scouttavling-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.scouttavling-headers.headers.frameDeny=true
      - traefik.http.middlewares.scouttavling-headers.headers.referrerPolicy=strict-origin-when-cross-origin

  migrate:
    image: ${APP_IMAGE:?Set APP_IMAGE}

  # Local dumps every BACKUP_INTERVAL seconds (default 15 min), keeping BACKUP_KEEP files.
  # Copy /backups offsite (restic etc., see docs/architecture/04 §7) — a dump on the same disk is not a backup.
  backup:
    image: postgres:18.6
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-scouttavling}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-900}
      BACKUP_KEEP: ${BACKUP_KEEP:-96}
    volumes:
      - backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/scouttavling-$$(date -u +%Y%m%dT%H%M%SZ).dump
          pg_dump -Fc -f "$$f.tmp" && mv "$$f.tmp" "$$f" && echo "backup $$f"
          ls -1t /backups/*.dump 2>/dev/null | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm -f
          sleep "$$BACKUP_INTERVAL"
        done

volumes:
  letsencrypt:
  backups:
